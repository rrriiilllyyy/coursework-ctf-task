version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ctf-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www/html
    depends_on:
      - php
      - mysql
    networks:
      - ctf-network
    restart: unless-stopped

  php:
    build: .
    container_name: ctf-php
    volumes:
      - ./app:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_USER=ctf_user
      - DB_PASSWORD=ctf_password
      - DB_NAME=ctf_db
    depends_on:
      - mysql
    networks:
      - ctf-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: ctf-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=ctf_db
      - MYSQL_USER=ctf_user
      - MYSQL_PASSWORD=ctf_password
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - ctf-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  ctf-network:
    driver: bridge
